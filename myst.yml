version: 1
project:
  title: Numerical Computation
  authors:
    - name: Jed Brown
  exclude:
    - VENV/*
    - README.md
    - slides.bak/*
  github: cu-numcomp/fall26
  thebe:
    binder:
      repo: cu-numcomp/fall26
      provider: github
      ref: main
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: index.md
    - file: syllabus.md
    - file: tips.md
    - file: slides.md
      children:
        - file: slides/2026-08-21-first-day.ipynb
        - file: slides/2026-08-24-functions.ipynb
        - file: slides/2026-08-26-conditioning.ipynb
        - file: slides/2026-08-28-stability.ipynb
        - file: slides/2026-08-31-rootfinding.ipynb
        - file: slides/2026-09-04-newton.ipynb
        - file: slides/2026-09-09-more-newton.ipynb
        - file: slides/2026-09-11-polynomials.ipynb
        - file: slides/2026-09-14-linear-algebra.ipynb
        - file: slides/2026-09-16-projections.ipynb
        - file: slides/2026-09-18-gram-schmidt.ipynb
site:
  options:
    logo: img/cu-numcomp.svg
    favicon: img/cu-numcomp-square.svg
    folders: true
  template: book-theme
